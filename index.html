<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Flock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

:root{
  --bg:#e8eff0; --surface:#ffffff; --ink:#132730; --muted:#52676f; --line:#cbd9dc; --accent:#0d6965; --on-accent:#ffffff;
  --common:#74847f; --rare:#2474c9; --epic:#8445c9; --legendary:#c98a08; --only:#d6336c;
  --card-face:#fbfdfc; --card-ink:#132730; --card-muted:#52676f;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d191f; --surface:#172830; --ink:#e8f1f1; --muted:#94aab1; --line:#2a414b; --accent:#55c8bd; --on-accent:#06201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d191f; --surface:#172830; --ink:#e8f1f1; --muted:#94aab1; --line:#2a414b; --accent:#55c8bd; --on-accent:#06201e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
#total{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
#mute{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:17px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.quiet{background:transparent;color:var(--accent);padding:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.center{text-align:center;align-items:center}
.note{color:var(--muted);font-size:14px}
#status:empty{display:none}
#status{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

.card{container-type:inline-size;display:block;width:100%;aspect-ratio:5/7;border:0;padding:0;background:none;position:relative;text-align:left}
.face{position:absolute;inset:0;border-radius:8cqi;padding:4cqi;display:flex;flex-direction:column;gap:2.5cqi;background:var(--rc);color:var(--card-ink)}
.common{--rc:var(--common);--sky:#dde7e4}.rare{--rc:var(--rare);--sky:#d3e8fa}.epic{--rc:var(--epic);--sky:#e9dcf8}.legendary{--rc:var(--legendary);--sky:#fbeabd}.only{--rc:var(--only);--sky:#ffe3ee}
.face.only{background:linear-gradient(130deg,#ff5f8f,#ffb43a,#47d6a4,#3ea6ff,#a45cff,#ff5f8f);background-size:300% 300%;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.nm{font-family:var(--display);font-weight:800;font-size:9cqi;line-height:1.05;background:var(--card-face);border-radius:4.5cqi;padding:3cqi 4cqi;min-height:25cqi;display:flex;align-items:center;overflow-wrap:anywhere}
.art{flex:1;min-height:0;border-radius:4.5cqi;background:var(--sky);display:flex;align-items:center;overflow:hidden}
.face.only .art{background:linear-gradient(160deg,#fff1c9,#ffe0ee 40%,#dcefff 75%,#e5fbe9)}
.art svg{width:100%;height:100%;display:block}
.art svg [fill="#f6f5f0"],.art svg [fill="#fbfaf6"],.art svg [fill="#fbfbf9"],.art svg [fill="#f6f7f5"],.art svg [fill="#fafbf8"],.art svg [fill="#fbfaf5"],.art svg [fill="#f7f9f9"]{stroke:rgba(20,40,50,.35);stroke-width:1}
.ft{background:var(--card-face);border-radius:4.5cqi;padding:3cqi 4cqi}
.sci{font-style:italic;font-size:6cqi;color:var(--card-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tier{display:flex;justify-content:space-between;gap:2cqi;font-weight:600;font-size:6.5cqi}
.pips{color:var(--card-muted);letter-spacing:.08em}
.badge{position:absolute;bottom:-7px;right:-4px;background:var(--ink);color:var(--bg);font-weight:600;font-size:12px;border-radius:99px;padding:2px 8px;z-index:2;font-variant-numeric:tabular-nums}
.card.unknown .face{background:var(--surface);border:2px dashed var(--rc);color:var(--muted)}
.card.unknown .art{background:transparent}
.card.unknown svg *{fill:var(--line)!important;stroke:var(--line)!important}
.card.unknown .nm{background:transparent;justify-content:center;color:var(--muted)}
.card.unknown .ft{background:transparent;text-align:center;font-size:7cqi;font-weight:600}

.big{width:min(290px,76vw,31vh);margin:0 auto;perspective:900px;position:relative}
.flip{display:block;position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.flip.up{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.side.front{transform:rotateY(180deg)}
.back{container-type:inline-size;position:absolute;inset:0;border-radius:23px;background:#0f4f59;display:flex;align-items:center;justify-content:center;overflow:hidden}
.back svg{width:100%;height:100%}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.grid4 .nm{font-size:10.5cqi;padding:3cqi;line-height:1.05;min-height:38cqi}
.grid4 .ft{display:none}
.deck{width:min(220px,58vw);margin:10px auto 6px;position:relative;aspect-ratio:5/7}
.deck .back{box-shadow:0 0 0 3px var(--bg)}
.deck .back:nth-child(1){transform:rotate(-8deg)}.deck .back:nth-child(2){transform:rotate(6deg)}

section.group{margin-bottom:26px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
nav button{flex:1;max-width:140px;background:none;border:0;border-radius:12px;padding:11px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{background:var(--bg);color:var(--ink)}
#sheet{position:fixed;inset:0;background:rgba(4,14,18,.82);z-index:20;display:flex;flex-direction:column;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .inner{margin:auto;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#sheet .info{background:var(--surface);border-radius:14px;padding:14px}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.face.only{animation:none}}

.face.epic,.face.legendary,.face.only{overflow:hidden}
.face.epic::after,.face.legendary::after,.face.only::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:34%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-160%) skewX(-18deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,35%{transform:translateX(-160%) skewX(-18deg)}80%,100%{transform:translateX(420%) skewX(-18deg)}}
.card.unknown .face::after{display:none}

.reveal>*{position:relative;z-index:9}
.top{height:46px;width:100%;display:flex;align-items:center;justify-content:center;font-weight:600}
.top .dots{transition:opacity .2s}
.top.shouting .dots{opacity:0}
#shout{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.shout{font-family:var(--display);font-weight:800;font-size:clamp(28px,9.5vw,40px);color:#fff;text-shadow:0 0 6px #000,0 0 18px var(--g),0 3px 0 var(--g);animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
.shout.epic{--g:#8b2fe0}.shout.legendary{--g:#d98a00}.shout.only{--g:#e0206f}
@keyframes slam{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
#says{min-height:48px;font-weight:600}
body.lit .reveal #says,body.lit .reveal .btn.quiet{color:#fff}
#dim{position:fixed;inset:0;background:rgba(5,10,24,.86);opacity:0;pointer-events:none;transition:opacity .45s;z-index:7}
body.lit #dim{opacity:1}
#rays{position:fixed;width:400px;height:400px;margin:-200px 0 0 -200px;left:50%;top:50%;border-radius:50%;pointer-events:none;z-index:8;visibility:hidden;will-change:transform;
  background:radial-gradient(closest-side,transparent 20%,rgba(5,10,24,.55) 70%,#050a18 100%),repeating-conic-gradient(var(--glow,#fff) 0 7deg,#050a18 7deg 20deg)}
#rays.on{visibility:visible;animation:spin 24s linear infinite}
#rays.on.only{background:radial-gradient(closest-side,transparent 20%,rgba(5,10,24,.55) 70%,#050a18 100%),conic-gradient(#ff5f8f,#050a18,#ffb43a,#050a18,#47d6a4,#050a18,#3ea6ff,#050a18,#a45cff,#050a18,#ff5f8f,#050a18,#ffb43a,#050a18,#47d6a4,#050a18,#3ea6ff,#050a18,#a45cff,#050a18,#ff5f8f);animation-duration:12s}
@keyframes spin{from{transform:scale(2.4)}to{transform:scale(2.4) rotate(360deg)}}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#flash{position:fixed;inset:0;pointer-events:none;z-index:29;opacity:0}
#flash.legendary{animation:flash .8s ease-out;background:#ffe9a8}
#flash.only{animation:flash 1.2s ease-out;background:#fff}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

.big::before{content:"";position:absolute;inset:-22% -28%;border-radius:50%;background:radial-gradient(closest-side,var(--glow) 45%,transparent);opacity:0;pointer-events:none;transform:translateZ(-1px)}
.big.charging{animation:rumble .11s linear infinite,swell var(--wait) ease-in forwards}
.big.charging::before{animation:beat .45s ease-in-out infinite alternate}
.big.glow.t-rare::before{opacity:.5}
.big.glow.t-epic::before,.big.glow.t-legendary::before,.big.glow.t-only::before{animation:beat 1.1s ease-in-out infinite alternate}
.big.t-only.charging::before,.big.t-only.glow::before{background:conic-gradient(#ff5f8f,#ffb43a,#47d6a4,#3ea6ff,#a45cff,#ff5f8f);-webkit-mask:radial-gradient(closest-side,#000 55%,transparent);mask:radial-gradient(closest-side,#000 55%,transparent)}
@keyframes rumble{0%{translate:-2px 1px;rotate:-.7deg}50%{translate:2px -2px;rotate:.8deg}100%{translate:-1px 2px;rotate:-.4deg}}
@keyframes swell{from{scale:.97}to{scale:1.08}}
@keyframes beat{from{opacity:.35;transform:scale(.88)}to{opacity:1;transform:scale(1.06)}}
.big.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.big.pop.quake{animation:quake .7s ease-out}
@keyframes pop{0%{scale:1.08}45%{scale:1.14}100%{scale:1}}
@keyframes quake{0%{scale:1.2;translate:0 0}15%{translate:-14px 6px}30%{translate:12px -8px}45%{translate:-9px -4px}60%{translate:7px 5px}80%{translate:-3px 0}100%{scale:1;translate:0 0}}
.grid4.deal .card{animation:deal .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{transform:translateY(24px) scale(.7);opacity:.2}}
.grid4 .card .face.epic{box-shadow:0 0 12px 1px #a855f7}
.grid4 .card .face.legendary{box-shadow:0 0 14px 3px #ffb703}
.grid4 .card .face.only{box-shadow:0 0 16px 4px #ff5fa2}

.odds button{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;font-variant-numeric:tabular-nums}
.odds .pc{color:var(--muted)}
.odds .note{margin:2px 0 8px}
#search{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#chips{display:flex;flex-wrap:wrap;gap:8px}
#chips button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600}
#chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#chips .sw{margin-right:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--rc);margin-right:9px}
.sw.only{background:linear-gradient(135deg,#ff5f8f,#ffb43a,#47d6a4,#3ea6ff)}
#tilt{perspective:700px;touch-action:none}
#tilt .card{transition:transform .12s;transform-style:preserve-3d}
#tilt.t-rare .face{box-shadow:0 0 24px 3px var(--glow)}
#tilt.t-epic .face,#tilt.t-legendary .face,#tilt.t-only .face{box-shadow:0 0 36px 8px var(--glow)}

/* Home Page Fact Card */
.fact-widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.fact-card-btn{width:min(240px,65vw);margin:0 auto;cursor:pointer;transition:transform .15s cubic-bezier(.2,1.2,.4,1)}
.fact-card-btn:active{transform:scale(.95)}
.fact-box{background:var(--bg);border-radius:12px;padding:14px;text-align:center}
.fact-box p{font-size:15px;line-height:1.4;font-weight:500}
.fact-box .bird-tag{font-weight:700;font-family:var(--display);font-size:17px;color:var(--accent);margin-bottom:4px}
.store-pill{display:inline-block;background:var(--accent);color:var(--on-accent);padding:4px 10px;border-radius:99px;font-weight:700;font-size:13px;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){.face::after,.big,.big::before,.big *,.shout,#rays,.grid4 .card{animation:none!important}}
</style>
</head>

const lum=h=>{const n=parseInt(h.slice(1),16);return (n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11};
function makeLook(famKey,code,flags){

  const f={}; for(const m of flags.matchAll(/([KBEM])([a-z])|([CLFSWMT])/g)){ if(m[1]) f[m[1]]=COLORS[m[2]]; else f[m[3]]=true }
  const mark=lum(Y)>120?"#3a3029":"#efe6d2", pink=famKey==="flamingo";
  const k={...x,gen:1,head:H,body:B,wing:W,belly:Y,beak:K,tail:W,eye:"#1a120c"};
  if(shape==="song"){
    if(f.K)k.cap=f.K; if(f.B)k.bib=f.B; if(f.E)k.cheek=f.E; if(f.M)k.mask=typeof f.M==="string"?f.M:"#17171a";
    if(f.C)k.crest=H; if(f.L)k.longtail=1; if(f.F)k.fork=1; if(f.S)k.spots=mark; if(f.W)k.bars="#f4efe2";
    if(k.curve){k.curveColor=K;k.beak="none"}
  }else{
    k.mCap=f.K; k.mBib=f.B; k.mCheek=f.E; k.mMask=f.M===true?"#17171a":f.M; k.mCrest=f.C?(f.K||H):null; k.mSpots=f.S?mark:null; k.train=f.T;
  }
  if(shape==="duck"){k.breast=Y;k.ring=H}
  if(shape==="wader"){k.neck=H;k.legs=pink?"#e2677a":lum(B)>200?"#3a3d42":"#6d6455";k.beaktip="#1c1c20";if(k.curve||k.thick){k.beakColor=K;k.beak="none"}}
  if(shape==="shore"){k.legs="#8a7448";if(k.curve){k.beakColor=K;k.beak="none"}}
  if(shape==="pigeon"){k.legs="#c9707a";if(x.tipped){k.tip=lum(W)>180?"#23272d":W;k.legs="#cf9d3a"}}
  if(shape==="raptor"){k.legs="#e0b62f";k.eye="#c98d14";if(x.ruffed){k.ruff=W;k.legs="#a9a49c"}}

const empty = ()=>({lastPullTime:0, storedPacks:1, pack:[], done:true, counts:{}, packs:0});

function clean(raw){
  const s=empty(); if(!raw||typeof raw!=="object") return s;
  s.lastPullTime=Number.isInteger(raw.lastPullTime)?raw.lastPullTime:0;
  s.storedPacks=Number.isInteger(raw.storedPacks)?raw.storedPacks:1;
  if(Array.isArray(raw.pack)) s.pack=raw.pack.filter(id=>Object.hasOwn(BY_ID,id)).slice(0,PACK_SIZE);
  s.done=raw.done!==false||!s.pack.length;
  for(const b of BIRDS){const n=raw.counts?.[b.id]; if(Number.isInteger(n)&&n>0) s.counts[b.id]=n}
  s.packs=Number.isInteger(raw.packs)?raw.packs:0;

  // Calculate offline accumulated packs
  const now = Date.now();
  if (s.lastPullTime > 0) {
    const elapsed = now - s.lastPullTime;
    const newGains = Math.floor(elapsed / COOLDOWN_MS);
    if (newGains > 0) {
      s.storedPacks = Math.min(MAX_STORED_PACKS, s.storedPacks + newGains);
      s.lastPullTime = s.lastPullTime + (newGains * COOLDOWN_MS);
    }
  } else {
    s.lastPullTime = now;
  }
  return s;
}

function burst(x,y,fx,n){

  g.setTransform(d,0,0,d,0,0); g.clearRect(0,0,innerWidth,innerHeight);

async function openPack(){

}

  v.innerHTML=`<div class="stack center reveal">${stageHTML()}
    <button class="btn" id="next">Flip card</button>
    <button class="btn quiet" id="skip">Skip to the best cards</button></div>`;
  v.querySelector(".dots").innerHTML=state.pack.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("");
  v.querySelector(".dots").setAttribute("aria-label",`Card ${step+1} of ${state.pack.length}`);
  const label=()=>{$("next").disabled=charging;$("next").textContent=charging?"Something big is coming…":!flipped?"Flip card":last?"See all my cards":"Next card";
    $("says").textContent=charging?"":!flipped?`Card ${step+1} of ${state.pack.length}`:isNew(step)?`New bird! ${b.name} joins your collection.`:`Duplicate. You now have ${shownCounts()[b.id]} of ${b.name}.`};
  const advance=()=>{
    if(charging) return;
    if(!flipped){
      charging=!!FX[b.tier].wait; label();
      reveal($("box"),b,()=>{charging=false;flipped=true;label();renderTotal()});
    }else if(last) finishPack();
    else{step++;flipped=false;render()}
  };
  $("reveal").onclick=advance; $("next").onclick=advance;
  $("skip").onclick=()=>{
    const from=flipped?step+1:step, j=state.pack.findIndex((id,i)=>i>=from&&big(BY_ID[id]));
    if(j<0) finishPack();
    else if(j===step) advance();
    else{step=j;flipped=false;render()}
  };
  if(flipped){$("box").querySelector(".front").innerHTML=cardHTML(b);$("box").querySelector(".flip").classList.add("up")}
  label();
}

function renderToday(v){
  state = readLocal();
  if(!ready){v.innerHTML=`<p class="note" style="text-align:center;padding:40px 0">Loading your collection…</p>`;return}
  if(preview) return renderPreview(v);
  
  if(!state.done) return renderReveal(v);

  const packsAvailable = state.storedPacks;
  
  if(packsAvailable > 0){
    v.innerHTML=`<div class="stack center">
      <div class="deck">${backArt()}${backArt()}${backArt()}</div>
      <div>
        <span class="store-pill">${packsAvailable} / ${MAX_STORED_PACKS} Packs Ready</span>
        <h2>${state.packs?"Your next pack is ready":"Your first pack is waiting"}</h2>
      </div>
      <button class="btn" id="open" ${busy?"disabled":""}>${busy?"Opening…":`Open ${PACK_SIZE} cards`}</button>
      <p class="note" style="margin-top:4px">Next pack in: <span id="timer">${timeUntilNextPack()}</span></p>
      </div><div style="margin-top:28px">${oddsHTML()}</div>`;
    $("open").onclick=openPack; return;
  }

  v.innerHTML=`<div class="stack">
    <div>
      <span class="store-pill" style="background:var(--muted)">0 / ${MAX_STORED_PACKS} Packs Ready</span>
      <h2>Today's cards</h2>
      <p class="note">Next pack unlock in <span id="timer">${timeUntilNextPack()}</span>.</p>
    </div>
    <div class="grid4${fresh?" deal":""}">${state.pack.map((id,i)=>`<button class="card" style="--i:${i}" data-id="${id}" aria-label="${BY_ID[id].name}">${isNew(i)?'<span class="badge">New</span>':""}${cardHTML(BY_ID[id])}</button>`).join("")}</div>
    <p class="note">Tap a card to see it up close.</p>
    ${oddsHTML()}</div>`;
}

function renderGrid(){
  const c=shownCounts(), q=bookQuery.trim().toLowerCase();
  const own=b=>c[b.id]>0;
  const list=q?BIRDS.filter(b=>own(b)&&`${b.name} ${b.sci} ${b.fam?FAM[b.fam][2]:""}`.toLowerCase().includes(q))
    :[...BY_TIER[bookTier].filter(own),...BY_TIER[bookTier].filter(b=>!own(b))];
  $("chips").hidden=!!q;
  $("count").textContent=q?`${list.length} of your birds match`:`${BY_TIER[bookTier].filter(own).length} of ${list.length} ${tierOf(bookTier).name} birds found`;
  $("grid").innerHTML=list.slice(0,bookShown).map(b=>own(b)
    ?`<button class="card" data-id="${b.id}" aria-label="${b.name}, you have ${c[b.id]}">${c[b.id]>1?`<span class="badge">×${c[b.id]}</span>`:""}${cardHTML(b)}</button>`
    :`<div class="card unknown ${b.tier}" role="img" aria-label="Undiscovered ${tierOf(b.tier).name} bird"><span class="face"><span class="nm">???</span><span class="art" aria-hidden="true">${art(b)}</span><span class="ft">${tierOf(b.tier).name}</span></span></div>`).join("");
  $("more").hidden=list.length<=bookShown;
}
function renderBook(v){
  if(!ready) return renderToday(v);
  v.innerHTML=`<div class="stack">
    <input id="search" type="search" placeholder="Search your birds" aria-label="Search your birds" autocomplete="off">
    <div id="chips">${TIERS.map(t=>`<button data-tier-pick="${t.id}" aria-pressed="${t.id===bookTier}"><span class="sw ${t.id}"></span>${t.name}</button>`).join("")}</div>
    <p id="count" class="note"></p><div id="grid" class="grid3"></div>
    <button class="btn quiet" id="more">Show more</button></div>`;
  $("search").value=bookQuery;
  $("search").oninput=e=>{bookQuery=e.target.value;bookShown=30;renderGrid()};
  $("more").onclick=()=>{bookShown+=30;renderGrid()};
  $("chips").onclick=e=>{const el=e.target.closest("[data-tier-pick]");if(!el)return;bookTier=el.dataset.tierPick;bookShown=30;
    $("chips").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===el));renderGrid()};
  renderGrid();
}
function renderTotal(){
  const c=shownCounts();
  $("total").textContent=ready?`${Object.values(c).filter(n=>n>0).length} of ${BIRDS.length.toLocaleString("en-US")} birds found`:"";
}
function render(){
  clearFx();
  const v=$("view");
  if(tab==="home") renderHome(v);
  else if(tab==="today") renderToday(v);
  else renderBook(v);
  renderTotal();
  for(const [id,name] of [["tab-home","home"],["tab-today","today"],["tab-book","book"]]){
    if(tab===name) $(id).setAttribute("aria-current","page"); else $(id).removeAttribute("aria-current");
  }
}
function openSheet(id){
  const b=BY_ID[id], n=shownCounts()[id], s=$("sheet"), fam=b.fam&&FAM[b.fam];
  s.innerHTML=`<div class="inner"><div class="big t-${b.tier}" id="tilt" style="--glow:${FX[b.tier].glow}"><div class="card">${cardHTML(b)}</div></div><div class="info"><p>${b.fact||`<strong>${fam[2]}.</strong> ${fam[3]}`}</p><p class="note" style="margin-top:6px">You have ${n} ${n===1?"copy":"copies"}.</p></div><button class="btn" id="close">Close</button></div>`;
  s.hidden=false; $("close").onclick=closeSheet; $("close").focus({preventScroll:true});
  if(big(b)){clearFx();audio();SOUND.rare()}
  const el=$("tilt");
  if(!calm()){
    el.onpointermove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.firstElementChild.style.transform=`rotateY(${x*24}deg) rotateX(${-y*24}deg)`};
    el.onpointerleave=el.onpointercancel=el.onpointerup=()=>{el.firstElementChild.style.transform=""};
  }
}
function closeSheet(){$("sheet").hidden=true}
$("view").addEventListener("click",e=>{
  const p=e.target.closest("[data-preview]");
  if(p){preview=p.dataset.preview;audio();render();scrollTo(0,0);return}
  const el=e.target.closest("[data-id]"); if(el) openSheet(el.dataset.id)});
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet")) closeSheet()});
addEventListener("keydown",e=>{if(e.key==="Escape") closeSheet()});
$("tab-home").onclick=()=>{tab="home";preview=null;render();scrollTo(0,0)};
$("tab-today").onclick=()=>{tab="today";preview=null;render();scrollTo(0,0)};
$("tab-book").onclick=()=>{tab="book";preview=null;render();scrollTo(0,0)};
function soundLabel(){$("mute").textContent=muted?"Sound off":"Sound on";$("mute").setAttribute("aria-pressed",!muted)}
$("mute").onclick=()=>{muted=!muted;try{localStorage.setItem("daily-flock-muted",muted?"1":"0")}catch{}
  if(muted) stopSound(); else{audio();SOUND.common()} soundLabel()};
soundLabel();

function tick(){
  state = readLocal();
  if($("timer")) $("timer").textContent=timeUntilNextPack();
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) tick()});
boot();
</script>
</body>
</html>
